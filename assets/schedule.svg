ial, sans-serif" font-size="15" font-weight="400" fill="#8b949e">Built a CRM and business-automation platform that moved the whole company off MS Teams: hierarchical</text><text x="360" y="603.8" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#8b949e">RBAC, automated reports, about 65% less manual work and a zero-downtime migration.</text><rect x="360.0" y="646" width="88.2" height="22" rx="11" fill="#8b949e" fill-opacity="0.08" stroke="#8b949e" stroke-width="1.2" opacity="0.95"/><text x="404.1" y="661" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" fill="#8b949e">PostgreSQL</text><rect x="455.2" y="646" width="67.7" height="22" rx="11" fill="#8b949e" fill-opacity="0.08" stroke="#8b949e" stroke-width="1.2" opacity="0.95"/><text x="489.1" y="661" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" fill="#8b949e">Express</text><rect x="529.9" y="646" width="54.1" height="22" rx="11" fill="#8b949e" fill-opacity="0.08" stroke="#8b949e" stroke-width="1.2" opacity="0.95"/><text x="557.0" y="661" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" fill="#8b949e">React</text><rect x="591.0" y="646" width="67.7" height="22" rx="11" fill="#8b949e" fill-opacity="0.08" stroke="#8b949e" stroke-width="1.2" opacity="0.95"/><text x="624.9" y="661" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" fill="#8b949e">Node.js</text><rect x="665.8" y="646" width="40.5" height="22" rx="11" fill="#8b949e" fill-opacity="0.08" stroke="#8b949e" stroke-width="1.2" opacity="0.95"/><text x="686.0" y="661" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" fill="#8b949e">JWT</text><rect x="0.75" y="0.75" width="1278.5