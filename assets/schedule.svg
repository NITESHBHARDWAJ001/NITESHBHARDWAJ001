ty="0.9"/><text x="900.3" y="211" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" fill="#5f584b">Razorpay</text><line x1="40" y1="244" x2="1240" y2="244" stroke="#1d1a15" stroke-width="1.4" stroke-dasharray="6 7"/><text x="40" y="296" font-family="Georgia, 'Times New Roman', serif" font-size="27" font-weight="700" fill="#1d1a15">Jul 2025 — Apr 2026</text><text x="40" y="324" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" letter-spacing="2" fill="#5f584b">STAGE 02</text><text x="360" y="300" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="700" fill="#1d1a15" letter-spacing="-1">Qgenii EdTech</text><text x="360" y="326" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" fill="#c9431e" font-weight="600">MERN Stack Developer Intern</text><text x="360" y="356.0" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5f584b">Part of a five-developer team building an EdTech and job-portal platform. Shipped the Contest Engine,</text><text x="360" y="377.8" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5f584b">Course Flow, Hiring Flow and Admin Dashboard on my own, and cut API response times by about 40%.</text><rect x="360.0" y="420" width="67.7" height="22" rx="11" fill="none" stroke="#5f584b" stroke-width="1.2" opacity="0.9"/><text x="393.9" y="435" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" fill="#5f584b">MongoDB</text><rect x="434.7" y="420" width="67.7" height="22" rx="11" fill="none" stroke="#5f584b" stroke-width="1.2" opacity="0.9"/><text x="468.6" y="435" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" fill="#5f584b">Express</text><rect x="509.5" y="420" width="54.1" height="22" rx="11" fill="none" stroke="#5f584b" stroke-width="1.2" opacity="0.9"/><text x="536.5" y="435" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" fill="#5f584b">React</text><rect x="570.6" y="420" width="67.7" height="22" rx="11" fill="none" stroke="#5f584b" stroke-width="1.2" opacity="0.9"/><text x="604.5" y="435" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" fill="#5f584b">Node.js</text><rect x="645.3" y="420" width="81.4" height="22" rx="11" fill="none" stroke="#5f584b" stroke-width="1.2" opacity="0.9"/><text x="686.0" y="435" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" fill="#5f584b">Socket.IO</text><rect x="733.7" y="420" width="60.9" height="22" rx="11" fill="none" stroke="#5f584b" stroke-width="1.2" opacity="0.9"/><text x="764.2" y="435" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" fill="#5f584b">Docker</text><line x1="40" y1="468" x2="1240" y2="468" stroke="#1d1a15" stroke-width="1.4" stroke-dasharray="6 7"/><text x="40" y="520" font-family="Georgia, 'Times New Roman', serif" font-size="27" font-weight="700" fill="#1d1a15">Jul 2025 — Dec 2025</text><text x="40" y="548" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" letter-spacing="2" fill="#5f584b">STAGE 01</text><text x="360" y="524" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="700" fill="#1d1a15" letter-spacing="-1">Bharati Expoads</text><text x="360" y="550" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" fill="#c9431e" font-weight="600">Full Stack Developer Intern</text><text x="360" y="580.0" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5f584b">Built a CRM and business-automation platform that moved the whole company off MS Teams: hierarchical</text><text x="360" y="601.8" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5f584b">RBAC, automated reports, about 65% less manual work and a zero-downtime migration.</text><rect x="360.0" y="644" width="88.2" height="22" rx="11" fill="none" stroke="#5f584b" stroke-width="1.2" opacity="0.9"/><text x="404.1" y="659" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" fill="#5f584b">PostgreSQL</text><rect x="455.2" y="644" width="67.7" height="22" rx="11" fill="none" stroke="#5f584b" stroke-width="1.2" opacity="0.9"/><text x="489.1" y="659" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" fill="#5f584b">Express</text><rect x="529.9" y="644" width="54.1" height="22" rx="11" fill="none" stroke="#5f584b" stroke-width="1.2" opacity="0.9"/><text x="557.0" y="659" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" fill="#5f584b">React</text><rect x="591.0" y="644" width="67.7" height="22" rx="11" fill="none" stroke="#5f584b" stroke-width="1.2" opacity="0.9"/><text x="624.9" y="659" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" fill="#5f584b">Node.js</text><rect x="665.8" y="644" width="40.5" height="22" rx="11" fill="none" stroke="#5f584b" stroke-width="1.2" opacity="0.9"/><text x="686.0" y="659" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" fill="#5f584b">JWT</text><line x1="40" y1="692" x2="1240" y2="692" stroke="#1d1a15" stroke-width="1.4" stroke-dasharray="6 7"/></svg>