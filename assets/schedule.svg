ill="#e6edf3">Jul 2025 — Apr 2026</text><text x="40" y="326" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" letter-spacing="2" fill="#8b949e">STAGE 02</text><text x="360" y="302" font-family="'Segoe UI', 'SF Pro Display', -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="800" fill="#e6edf3" letter-spacing="-1">Qgenii EdTech</text><text x="360" y="328" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" fill="#2ee6d6" font-weight="600">MERN Stack Developer Intern</text><text x="360" y="358.0" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#8b949e">Part of a five-developer team building an EdTech and job-portal platform. Shipped the Contest Engine,</text><text x="360" y="379.8" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#8b949e">Course Flow, Hiring Flow and Admin Dashboard on my own, and cut API response times by about 40%.</text><rect x="360.0" y="422" width="67.7" height="22" rx="11" fill="#8b949e" fill-opacity="0.08" stroke="#8b949e" stroke-width="1.2" opacity="0.95"/><text x="393.9" y="437" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" fill="#8b949e">MongoDB</text><rect x="434.7" y="422" width="67.7" height="22" rx="11" fill="#8b949e" fill-opacity="0.08" stroke="#8b949e" stroke-width="1.2" opacity="0.95"/><text x="468.6" y="437" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" fill="#8b949e">Express</text><rect x="509.5" y="422" width="54.1" height="22" rx="11" fill="#8b949e" fill-opacity="0.08" stroke="#8b949e" stroke-width="1.2" opacity="0.95"/><text x="536.5" y="437" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size