name: Update live GitHub stats

# Redraws assets/github-live.svg from your real GitHub numbers once a day.
# The file only changes when a number (or the date) changes, so at most one commit a day.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch stats and redraw the SVG
        env:
          # Optional: add a repo secret STATS_TOKEN (a classic PAT with the read:user scope) to
          # include private-repo contributions. Without it the built-in token is used.
          GH_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          PROFILE_USER: ${{ github.repository_owner }}
        run: python _build/fetch_stats.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-live.svg
          if git diff --cached --quiet; then
            echo "No change"
          else
            git commit -m "chore: refresh live GitHub stats"
            git push
          fi
